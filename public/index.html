<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Khawar Ali's Web Engineering Lab portfolio showcasing office hours and feedback."
    />
    <title>Web Engineering Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <header id="header">
      <h1 id="greeting">Web Engineering Lab</h1>
      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="#schedule" aria-current="location">Office Hours</a></li>
          <li><a href="#feedback">Send Feedback</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <!-- Office Hours Section -->
      <section id="schedule">
        <h2 id="schedule-heading">Office Hours</h2>
        <div class="table-container">
          <table>
            <caption>Weekly office hours</caption>
            <thead>
              <tr>
                <th scope="col">Book</th>
                <th scope="col">Day</th>
                <th scope="col">Time</th>
                <th scope="col">Room</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <button type="button" data-day="Monday" aria-label="Book Monday office hours">
                    Select
                  </button>
                </td>
                <td>Monday</td>
                <td>
                  <time datetime="10:00">10:00</time>–<time datetime="11:00">11:00</time>
                </td>
                <td>Room 214</td>
              </tr>
              <tr>
                <td>
                  <button type="button" data-day="Wednesday" aria-label="Book Wednesday office hours">
                    Select
                  </button>
                </td>
                <td>Wednesday</td>
                <td>
                  <time datetime="14:00">14:00</time>–<time datetime="15:00">15:00</time>
                </td>
                <td>Room 214</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Status paragraph targeted by main.js getRequired("#status") -->
        <p id="status" class="span-all text-muted" role="status" aria-live="polite"></p>

        <figure>
          <svg
            role="img"
            aria-labelledby="pin-title"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <title id="pin-title">Location pin</title>
            <path
              d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5-2.5-1.12 2.5-2.5 2.5z"
              fill="currentColor"
            />
          </svg>
          <figcaption class="text-muted">
            All office hours are held in Room 214.
          </figcaption>
        </figure>
      </section>

      <!-- Feedback Form Section -->
      <section id="feedback">
        <h2>Send Feedback</h2>
        <form id="feedback-form" novalidate>
          <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input
              type="email"
              name="email"
              id="email"
              required
              aria-describedby="email-hint"
            />
            <span class="text-muted" id="email-hint">
              We will only use this to reply to you.
            </span>
          </div>

          <fieldset class="span-all">
            <legend>Topic</legend>
            <label>
              <input type="radio" name="topic" value="general" checked />
              General Inquiry
            </label>
            <label>
              <input type="radio" name="topic" value="lab" />
              Lab Question
            </label>
          </fieldset>

          <div class="form-group span-all">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
          </div>

          <div class="form-group span-all">
            <button type="submit">Send</button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <address>Contact me: <a href="mailto:khawarali5491@gmail.com">khawarali5491@gmail.com</a></address>
    </footer>

    <script type="module" src="main.js"></script>
    <script type="module" src="feedback.js"></script>
  </body>
</html>
